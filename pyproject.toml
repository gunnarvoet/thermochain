[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[project]
name = "thermochain"
version = "2026.03.0"
authors = [
    {name = "Gunnar Voet", email = 'gvoet@ucsd.edu'},
]
description = "Moored thermistor processing"
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["physical oceanography"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Oceanography",
    ]
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy>=1.26.2",
    "xarray>=2023.12.0",
    "matplotlib>=3.8.2",
    "gsw>=3.6.17",
    "pyyaml>=6.0.1",
    "python-box>=7.1.1",
    "openpyxl>=3.1.2",
    "tqdm",
    "mixsea",
    "sbemoored",
    "rbrmoored",
    "loguru",
    "odfpy>=1.4.1",
]

[project.urls]
# Homepage = "https://example.com"
# Documentation = "https://readthedocs.org"
Repository = "https://github.com/gunnarvoet/thermochain.git"
Issues = "https://github.com/gunnarvoet/thermochain/issues"
Changelog = "https://github.com/gunnarvoet/thermochain/blob/main/HISTORY.md"

[tool.pytest.ini_options]
# in general, do not place a `__init__.py` in your tests
# options are explained here:
# https://learn.scientific-python.org/development/guides/pytest/
# minversion = "6.0"
# addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config", "--import-mode=importlib"]
# xfail_strict = true
# filterwarnings = ["error"]
# log_cli_level = "info"
testpaths = ["tests"]
filterwarnings = [
    "error",
    # note the use of single quote below to denote "raw" strings in TOML
    'ignore:invalid escape sequence:DeprecationWarning',
    # netCDF4 wheels can ship with an older numpy ABI stamp — cosmetic,
    # the module works at runtime. netCDF4 is imported transitively via
    # rbrmoored / sbemoored / xarray. Harmless with current wheels but
    # kept as a safety net for ABI-mismatched netCDF4/numpy combinations.
    'ignore:numpy\.ndarray size changed:RuntimeWarning',
    # the unchanged sensor_drift primitive uses xarray's GroupBy.apply in
    # remove_outliers; xarray emits a PendingDeprecationWarning we do not
    # want escalated to an error inside fit_drift's real fit.
    'ignore:GroupBy\.apply may be deprecated:PendingDeprecationWarning',
]

[tool.uv.build-backend]
# Single top-level module (the deprecated `thermodrift` alias shim was removed).
module-name = ["thermochain"]

[tool.pdm]
package-type = "library"

[tool.uv.sources]
sbemoored = { path = "../sbemoored", editable = true }
rbrmoored = { path = "../rbrmoored", editable = true }
# mixsea = { path = "../mixsea", editable = true }
mixsea = { git = "https://github.com/modscripps/mixsea", branch = "main" }


[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.1",
    "pdoc>=15.0.0",
]
