[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thermodrift"
version = "2023.12.0"
authors = [
    {name = "Gunnar Voet", email = 'gvoet@ucsd.edu'},
    ]
description = "Moored thermistor processing Python package"
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["physical oceanography"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Oceanography",
    ]
requires-python = ">= 3.8"
dependencies = []

[project.urls]
# Homepage = "https://example.com"
# Documentation = "https://readthedocs.org"
Repository = "https://github.com/gunnarvoet/thermodrift.git"
Issues = "https://github.com/gunnarvoet/thermodrift/issues"
Changelog = "https://github.com/gunnarvoet/thermodrift/blob/main/HISTORY.md"

[tool.pytest.ini_options]
# in general, do not place a `__init__.py` in your tests
# options are explained here:
# https://learn.scientific-python.org/development/guides/pytest/
# minversion = "6.0"
# addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config"]
# xfail_strict = true
# filterwarnings = ["error"]
# log_cli_level = "info"
testpaths = ["src/thermodrift/tests"]
